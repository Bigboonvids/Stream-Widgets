<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Background Music Widget</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
  }

  #nowplaying {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    font-size: 15px;
    max-width: 380px;
  }

  #note {
    font-size: 16px;
    flex-shrink: 0;
  }

  #title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #tapOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }

  #tapOverlay.hidden {
    display: none;
  }
</style>
</head>
<body>

<div id="nowplaying">
  <span id="note">🎵</span>
  <span id="title">Loading playlist…</span>
</div>

<div id="tapOverlay">Tap once to start music</div>

<audio id="player" preload="auto"></audio>

<script>
  // =========================================================
  // ADD YOUR DOWNLOADED TRACKS HERE
  // Upload the mp3 files to the SAME folder/repo as this page,
  // then list their filenames below (and a display name).
  // Order doesn't matter if shuffle is on.
  // =========================================================
  const TRACKS = [
    // { file: "tracks/example-track-1.mp3", title: "Example Track 1" },
    // { file: "tracks/example-track-2.mp3", title: "Example Track 2" },
  ];

  const SHUFFLE = true; // set to false to play in listed order

  // ---- Playback logic ----
  const player = document.getElementById("player");
  const titleEl = document.getElementById("title");
  const tapOverlay = document.getElementById("tapOverlay");

  let queue = [];

  function buildQueue() {
    queue = [...TRACKS];
    if (SHUFFLE) {
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
    }
  }

  function playNext() {
    if (queue.length === 0) {
      if (TRACKS.length === 0) {
        titleEl.textContent = "No tracks added yet";
        return;
      }
      buildQueue();
    }
    const next = queue.shift();
    player.src = next.file;
    titleEl.textContent = next.title;
    player.play().catch(() => {
      // Autoplay was blocked, show tap-to-start overlay
      tapOverlay.classList.remove("hidden");
    });
  }

  player.addEventListener("ended", playNext);

  tapOverlay.addEventListener("click", () => {
    tapOverlay.classList.add("hidden");
    player.play();
  });

  // Kick things off
  buildQueue();
  playNext();
</script>

</body>
</html>
